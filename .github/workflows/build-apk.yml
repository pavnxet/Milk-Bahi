name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - milk-tracker-apk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Android Platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/MilkBahi_v2.01.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MilkBahi_v2.01.apk
          path: android/app/build/outputs/apk/debug/MilkBahi_v2.01.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.01.${{ github.run_number }}
          name: Release v2.01.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/MilkBahi_v2.01.apk
          draft: false
          prerelease: false
          make_latest: true

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - milk-tracker-apk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Get version from package.json
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Android Platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks

      - name: Build APK (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: VirusTotal Scan
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk

      # Verdict gate: the scan step above only returns analysis URLs
      # (`<filename>=<analysisURL>`, comma separated) — no detection counts —
      # so this step polls the VirusTotal API and fails the job ONLY on real
      # detections (stats.malicious > 0). Scanner outages, missing keys, or
      # still-queued analyses warn and pass so infra flakiness never blocks
      # the release; check the step log for details.
      - name: VirusTotal verdict gate
        if: always()
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::notice::VT_API_KEY missing, skipping verdict gate."
            exit 0
          fi
          if [ -z "$VT_ANALYSIS" ]; then
            echo "::notice::No VirusTotal analysis output (scan step may have failed), skipping verdict gate."
            exit 0
          fi
          fail=0
          IFS=',' read -ra pairs <<< "$VT_ANALYSIS"
          for pair in "${pairs[@]}"; do
            url="${pair##*=}"
            id="$(basename "$url")"
            echo "Checking analysis $id ..."
            malicious=""
            for i in $(seq 1 12); do
              resp="$(curl -s --max-time 30 -H "x-apikey: $VT_API_KEY" \
                "https://www.virustotal.com/api/v3/analyses/$id" || true)"
              status="$(echo "$resp" | grep -o '"status":"[a-z]*"' | head -1 | cut -d'"' -f4)"
              malicious="$(echo "$resp" | grep -o '"malicious":[0-9]*' | head -1 | cut -d: -f2)"
              if [ "$status" = "completed" ] && [ -n "$malicious" ]; then
                break
              fi
              # Fallback: file-analysis URLs carry the file hash, not an
              # analysis id — query the file endpoint for last stats instead.
              fresp="$(curl -s --max-time 30 -H "x-apikey: $VT_API_KEY" \
                "https://www.virustotal.com/api/v3/files/$id" || true)"
              fmal="$(echo "$fresp" | grep -o '"malicious":[0-9]*' | head -1 | cut -d: -f2)"
              if [ -n "$fmal" ]; then
                malicious="$fmal"
                break
              fi
              echo "Attempt $i/12: status=${status:-unknown}, waiting 30s..."
              sleep 30
            done
            if [ -z "$malicious" ]; then
              echo "::warning::Could not determine verdict for $id, skipping."
              continue
            fi
            echo "malicious=$malicious for $id"
            if [ "$malicious" -gt 0 ]; then
              echo "::error::VirusTotal reports $malicious malicious detection(s) for $id"
              fail=1
            fi
          done
          exit $fail

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Milk_Bahi_v${{ env.VERSION }}.apk
          path: android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}.${{ github.run_number }}
          name: Release v${{ env.VERSION }}.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Remove keystore
        if: always()
        run: rm -f android/release.jks

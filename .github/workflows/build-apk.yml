name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - milk-tracker-apk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Get version from package.json
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
            echo "KEYSTORE_PATH=$(pwd)/android/release.jks" >> $GITHUB_ENV
          else
            echo "No keystore provided, using debug signing"
            echo "KEYSTORE_PATH=" >> $GITHUB_ENV
          fi

      - name: Build APK (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            ./gradlew assembleRelease
          fi

      - name: Verify APK Built Successfully
        run: |
          ls -la android/app/build/outputs/apk/release/
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK build failed!"
            exit 1
          fi

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milk_Bahi_v${{ env.VERSION }}.apk
          path: android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk
          retention-days: 30

      - name: VirusTotal Scan
        if: ${{ secrets.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk
        continue-on-error: true

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}.${{ github.run_number }}
          name: Release v${{ env.VERSION }}.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/Milk_Bahi_v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
